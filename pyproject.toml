[project]
name = "netlogger-mcp"
version = "0.3.1"
description = "MCP server for net logging: live and past nets and check-ins, rate-limited to NetLogger's guidelines"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "maintainers@qso-graph.io"}]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0,<5",
    "defusedxml>=0.7",
    # The root set TLS verifies against, so it is a dependency this project
    # updates rather than whichever store the running Python was built
    # against (qso-graph-devel#73).
    "certifi>=2026.10.19",
]
keywords = [
    "amateur-radio", "ham-radio", "netlogger", "net-control", "check-ins",
    "mcp", "model-context-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest", "jsonschema"]

[project.urls]
Homepage = "https://qso-graph.io"
Documentation = "https://qso-graph.io/servers/netlogger-mcp/"
Repository = "https://github.com/qso-graph/netlogger-mcp"
Issues = "https://github.com/qso-graph/netlogger-mcp/issues"

[project.scripts]
netlogger-mcp = "netlogger_mcp.server:main"


[dependency-groups]
dev = ["pytest>=8", "jsonschema", "ruff>=0.6.8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netlogger_mcp"]

# Lint and type settings follow adif-mcp, the reference for every qso-graph
# Python repo (qso-graph-devel#66). Copied rather than invented so the repos do
# not each grow a style of their own.
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 95
extend-exclude = [".venv", "dist", "build", ".eggs", ".pytest_cache", "site", "scripts"]

[tool.ruff.lint]
# F and I are the rules that find defects: an unused import, an undefined name,
# an import block out of order. They ran here from the start.
#
# E501 is a width, and it is adif-mcp's width — these repos were not written to
# it. It was deferred (qso-graph-devel#70) because on cq-zones-mcp it reported
# 39 lines and not one of them was a defect: the rules that find defects went in
# first and this one waited. That pass is now done here (#45). E501 reported 105
# lines in this repo, and not one of them was a defect either — which is the
# finding, not an argument against enforcing it. A consistent width is worth
# having; it just was never the thing holding the quality.
#
# One line is exempt, at the line rather than the file, and it names what is
# exempted: tests/test_netlogger.py asserts NetLogger's own query string
# whole, because the test is that we send exactly that. Split across two
# literals it stops being greppable against NetLogger's documentation, which
# is the reason for asserting the URL instead of the parameters. There the
# length is the correctness.
select = ["E", "F", "I"]
fixable = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
