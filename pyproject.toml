[project]
name = "netlogger-mcp"
version = "0.1.9"
description = "MCP server for net logging: live and past nets and check-ins, rate-limited to NetLogger's guidelines"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "ki7mt@yahoo.com"}]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0",
    "defusedxml>=0.7",
]
keywords = [
    "amateur-radio", "ham-radio", "netlogger", "net-control", "check-ins",
    "mcp", "model-context-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest", "jsonschema"]

[project.urls]
Homepage = "https://qso-graph.io"
Documentation = "https://qso-graph.io/servers/netlogger-mcp/"
Repository = "https://github.com/qso-graph/netlogger-mcp"
Issues = "https://github.com/qso-graph/netlogger-mcp/issues"

[project.scripts]
netlogger-mcp = "netlogger_mcp.server:main"


[dependency-groups]
dev = ["pytest>=8", "jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netlogger_mcp"]
